<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ramadan Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
  <h1>🌙 Ramadan Tracker</h1>
  <p class="subtitle">Pilih Nama</p>

  <!-- LIST NAMA -->
  <div id="list" class="grid"></div>

  <!-- GRAFIK PROGRESS (MUNCUL SAAT KLIK NAMA) -->
  <div id="chartBox" style="display:none; margin-top:32px">
    <h3 id="chartName"></h3>
    <canvas id="progressChart" height="140"></canvas>
  </div>
</div>

<!-- MUSIC PLAYER -->
<div class="music-player">
  <select id="musicSelect">
    <option value="">🎵 Pilih Musik</option>
    <option value="music/nasheed1.mp3">Nasheed 1</option>
    <option value="music/nasheed2.mp3">Nasheed 2</option>
  </select>
  <button id="playBtn">▶️</button>
</div>

<audio id="audio" preload="auto"></audio>

<!-- CHART JS (WAJIB UNTUK GRAFIK) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- SCRIPT UTAMA -->
<script src="script.js"></script>
</body>
</html>
