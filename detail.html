<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Detail Tugas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2 id="nama"></h2>

  <div class="table-wrapper">
    <table id="tabel">
      <thead>
        <tr>
          <th>Tugas</th>
          <th>Ahad</th>
          <th>Senin</th>
          <th>Selasa</th>
          <th>Rabu</th>
          <th>Kamis</th>
          <th>Jumat</th>
          <th>Sabtu</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<!-- ================= MUSIC PLAYER ================= -->
<div class="music-player">
  <select id="musicSelect">
    <option value="">🎵 Pilih Musik</option>
    <option value="music/nasheed1.mp3">Nasheed 1</option>
  </select>
  <button id="playBtn">▶️</button>
</div>

<audio id="audio" preload="auto"></audio>

<!-- SCRIPT PALING BAWAH -->
<script src="script.js"></script>
</body>
</html>
